display_errors = On
error_reporting = E_ALL
upload_max_filesize = 20M
post_max_size = 20M
; Mantido acima do teto de 48 MB dos system logs para absorver leitura do
; arquivo completo e o overhead da serialização da resposta.
memory_limit = 512M
max_execution_time = 60
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
date.timezone = America/Sao_Paulo
